[project]
name = "fastapi-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "Geovana Venera",email = "geovana.venera@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "tzdata (>=2026.2,<2027.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "typos (>=1.46.2,<2.0.0)",
    "pytest-randomly (>=4.1.0,<5.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT','FAST']

[tool.ruff.format]
preview = true
quote-style = 'double'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings','--cov=fast_zero', '--cov-context=test', '--cov-branch']

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev fastapi_zero/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fastapi_zero -vv'
post_test = 'coverage html'

[tool.typos.files]
extend-exclude = ["README.md"]

[tool.typos.default.extend-words]
inicial = "inicial"